        <section>
            <!-- formulaire-->
           <form>
  <h2>inscription</h2>

  <fieldset>
    <legend>informations personnelles</legend>

    <label for="nom">Nom:</label>
    <input type="text" id="nom" name="nom" placeholder="votre nom">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="votre email">

    <label for="mdp">mot de passe</label>
    <input type="password" id="mdp" name="mdp" placeholder="votre mot de passe">
  </fieldset>

  <fieldset>
    <legend>Informations Supplémentaires</legend>

    <label>Sexe :</label>
    <input type="radio" name="sexe" id="femme" value="femme">
    <label for="femme">Femme</label>
    <input type="radio" name="sexe" id="homme" value="homme">
    <label for="homme">Homme</label>

    <br><br>

    <label>Intérets :</label>
    <input type="checkbox" name="interets" id="vetements" value="vetements">
    <label for="vetements">Vetements</label>
    <input type="checkbox" name="interets" id="accessoires" value="accessoires">
    <label for="accessoires">Accessoires</label>

    <br><br>

    <label for="pays">Pays :</label>
    <select name="pays" id="pays">
      <option value="france">France</option>
      <option value="maroc">Maroc</option>
      <option value="italie">Italie</option>
    </select>
  </fieldset>

  <br>
  <input type="submit" value="s'inscrire">

</form>
